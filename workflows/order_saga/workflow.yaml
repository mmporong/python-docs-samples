# [START workflows_order_saga_workflow]
# Charges an order, then fulfills it. If fulfillment fails, refunds the charge,
# so the order never ends up paid but not fulfilled. Each step is safe to
# retry because each service processes an order ID only once.
# Deploy with the PAYMENT_FUNCTION_URL, FULFILLMENT_URL, and REFUND_FUNCTION_URL
# environment variables, and optionally FIRESTORE_DATABASE.
main:
  params: [args]
  steps:
    - init:
        assign:
          - order_id: ${string(args.order_id)}
          - database: ${default(sys.get_env("FIRESTORE_DATABASE"), "(default)")}
          - documents: ${"projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID") + "/databases/" + database + "/documents"}
    - create_order:
        try:
          call: googleapis.firestore.v1.projects.databases.documents.createDocument
          args:
            collectionId: orders
            parent: ${documents}
            documentId: ${order_id}
            body:
              fields:
                order_state:
                  stringValue: created
                amount_cents:
                  integerValue: ${string(args.amount_cents)}
        except:
          as: e
          steps:
            - check_conflict:
                switch:
                  # A retried request continues with the existing order.
                  - condition: ${map.get(e, "code") != 409}
                    raise: ${e}
    - charge:
        try:
          call: http.post
          args:
            url: ${sys.get_env("PAYMENT_FUNCTION_URL")}
            auth:
              type: OIDC
            body:
              order_id: ${order_id}
            timeout: 30
        retry: ${http.default_retry}
    - fulfill:
        try:
          call: http.post
          args:
            url: ${sys.get_env("FULFILLMENT_URL")}
            auth:
              type: OIDC
            body:
              order_id: ${order_id}
            timeout: 30
        # Retry transient failures before treating fulfillment as failed.
        retry: ${http.default_retry}
        except:
          as: e
          steps:
            - refund:
                # The compensating step: undo the charge.
                try:
                  call: http.post
                  args:
                    url: ${sys.get_env("REFUND_FUNCTION_URL")}
                    auth:
                      type: OIDC
                    body:
                      order_id: ${order_id}
                    timeout: 30
                retry: ${http.default_retry}
            - report_refund:
                return:
                  order_id: ${order_id}
                  status: refunded
                  reason: ${default(map.get(e, "message"), "fulfillment failed")}
    - finish:
        return:
          order_id: ${order_id}
          status: fulfilled
# [END workflows_order_saga_workflow]
